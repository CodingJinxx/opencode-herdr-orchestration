name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify semantic version tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$tag"
          printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$tag" = "$package_version"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Publish npm package
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if published_sha="$(npm view "$name@$version" dist.gitHead 2>/dev/null)"; then
            test "$published_sha" = "$GITHUB_SHA"
            echo "Version $version is already published from this commit; continuing."
          else
            lookup_error="$(npm view "$name@$version" dist.gitHead 2>&1 >/dev/null || true)"
            if printf '%s\n' "$lookup_error" | grep -q 'E404'; then
              npm publish --access public --provenance
            else
              printf '%s\n' "$lookup_error" >&2
              exit 1
            fi
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
