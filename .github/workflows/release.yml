name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify semantic version tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$tag"
          printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$tag" = "$package_version"
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Publish npm package
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          local_integrity="$(npm pack --json --dry-run | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input)[0].integrity))")"
          if published_integrity="$(npm view "$name@$version" dist.integrity 2>/dev/null)"; then
            test "$published_integrity" = "$local_integrity"
            echo "Version $version is already published with identical package bytes; continuing."
          else
            lookup_error="$(npm view "$name@$version" dist.integrity 2>&1 >/dev/null || true)"
            if printf '%s\n' "$lookup_error" | grep -q 'E404'; then
              npm publish --access public
            else
              printf '%s\n' "$lookup_error" >&2
              exit 1
            fi
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
