name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22.22.2, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - name: Verify publish manifest
        run: node -e "const p=require('./package.json'); if (p.bin['flocky'] !== 'bin/orchestration.js') process.exit(1)"
      - name: Verify packed CLI
        shell: bash
        run: |
          set -euo pipefail
          package="$(npm pack --silent)"
          npm install --global "$package"
          flocky status

  gate:
    name: CI
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = "success"
